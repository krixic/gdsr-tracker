name: Update Spreadsheet Data

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-data:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Import spreadsheet data
              run: npm run update-data

            - name: Regenerate dataset index
              run: node scripts/generate-datasets.js

            - name: Commit updated datasets
              uses: stefanzweifel/git-auto-commit-action@v6
              with:
                  commit_message: "chore: update spreadsheet datasets"
                  file_pattern: src/data/*.js
